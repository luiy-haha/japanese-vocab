<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日文詞彙溫習（多課版）</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif; background: #f8f6f2; }
  .jp { font-family: 'Noto Sans JP', sans-serif; }
  .card { transition: all 0.15s; }
  .matched { opacity: 0.35; pointer-events: none; }
  .correct { background: #dcfce7 !important; border-color: #16a34a !important; }
  .wrong { background: #fee2e2 !important; border-color: #dc2626 !important; }
</style>
</head>
<body class="min-h-screen">
<div class="max-w-4xl mx-auto p-4 md:p-6">
  <header class="text-center mb-4">
    <h1 class="text-3xl md:text-4xl font-bold text-emerald-900">日文詞彙溫習</h1>
    <p class="text-gray-600 mt-1">みんなの日本語 初級Ⅰ　第1～12課</p>
  </header>

  <!-- Lesson Selector -->
  <div class="flex flex-wrap items-center justify-center gap-2 mb-4">
    <label class="text-sm text-gray-600">課題：</label>
    <select id="lesson-select" onchange="changeLesson(this.value)" class="border rounded-lg px-3 py-1.5 bg-white text-sm">
      <option value="all">全部課題</option>
      <option value="1">第1課 初めまして</option>
      <option value="2">第2課 これから お世話に</option>
      <option value="3">第3課 これを ください</option>
      <option value="4">第4課 そちらは 何時までですか</option>
      <option value="5">第5課 この電車は 甲子園へ</option>
      <option value="6">第6課 いっしょに 行きませんか</option>
      <option value="7">第7課 いらっしゃい</option>
      <option value="8">第8課 そろそろ 失礼します</option>
      <option value="9">第9課 わかります</option>
      <option value="10">第10課 ナンプラー、ありますか</option>
      <option value="11">第11課 これ、お願いします</option>
      <option value="12">第12課 祇園祭は どうでしたか</option>
    </select>
  </div>

  <!-- Navigation -->
  <nav class="flex flex-wrap gap-2 justify-center mb-4">
    <button onclick="setMode('match')" id="nav-match" class="px-4 py-2 rounded-full text-sm font-medium bg-emerald-800 text-white">配對（初階）</button>
    <button onclick="setMode('jp2cn')" id="nav-jp2cn" class="px-4 py-2 rounded-full text-sm font-medium bg-gray-200">日→中（中階）</button>
    <button onclick="setMode('cn2jp')" id="nav-cn2jp" class="px-4 py-2 rounded-full text-sm font-medium bg-gray-200">中→日（高階）</button>
    <button onclick="setMode('library')" id="nav-library" class="px-4 py-2 rounded-full text-sm font-medium bg-gray-200">温習庫</button>
    <button onclick="setMode('wrong')" id="nav-wrong" class="px-4 py-2 rounded-full text-sm font-medium bg-gray-200">錯題庫 <span id="wrong-count" class="ml-1 bg-red-500 text-white text-xs px-1.5 rounded-full">0</span></button>
    <button onclick="setMode('editor')" id="nav-editor" class="px-4 py-2 rounded-full text-sm font-medium bg-gray-200">詞彙管理</button>
  </nav>

  <div class="text-center text-sm text-gray-600 mb-3" id="stats"></div>

  <div id="content" class="bg-white rounded-2xl shadow-lg p-5 md:p-6 min-h-[420px]">
    <!-- dynamic -->
  </div>
</div>

// ==================== State ====================
let currentLessonId = "all";
let mode = "match";
let currentQueue = [];
let currentIndex = 0;
let matchItems = [];
let selectedJP = null;
let selectedCN = null;
let matchBatchSize = 10;
let wrongByLesson = {}; // { "1": Set, "2": Set, ..., "all": Set }
let currentSpeakText = "";
let currentAudio = null;

// ==================== Persistence ====================
function loadData() {
  const savedWrong = localStorage.getItem("jpWrongMulti");
  if (savedWrong) {
    const obj = JSON.parse(savedWrong);
    for (const k in obj) wrongByLesson[k] = new Set(obj[k]);
  }
  matchBatchSize = parseInt(localStorage.getItem("jpMatchBatchSize")) || 10;
  if (![10, 20, 9999].includes(matchBatchSize)) matchBatchSize = 10;
  updateWrongCount();
}

function saveWrong() {
  const obj = {};
  for (const k in wrongByLesson) obj[k] = [...wrongByLesson[k]];
  localStorage.setItem("jpWrongMulti", JSON.stringify(obj));
  updateWrongCount();
}

function getWrongSet(lessonId) {
  if (!wrongByLesson[lessonId]) wrongByLesson[lessonId] = new Set();
  return wrongByLesson[lessonId];
}

function updateWrongCount() {
  const set = getWrongSet(currentLessonId);
  document.getElementById("wrong-count").textContent = set.size;
}

function getActiveWords() {
  if (currentLessonId === "all") {
    return LESSONS.flatMap(l => l.words);
  }
  const lesson = LESSONS.find(l => l.id === currentLessonId);
  return lesson ? lesson.words : [];
}

function getActiveWrongWords() {
  const set = getWrongSet(currentLessonId);
  return getActiveWords().filter(w => set.has(w.id));
}

// ==================== TTS ====================
function speakJapanese(text) {
  if (!text) return;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (window.speechSynthesis) speechSynthesis.cancel();

  const encoded = encodeURIComponent(text);
  const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encoded}&tl=ja&client=tw-ob&ttsspeed=0.9`;
  const audio = new Audio(url);
  currentAudio = audio;
  audio.onerror = () => fallbackSpeak(text);
  audio.play().catch(() => fallbackSpeak(text));
}

function fallbackSpeak(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP";
  u.rate = 0.85;
  const voices = speechSynthesis.getVoices();
  const v = voices.find(vv => vv.lang.startsWith("ja"));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

function speakCurrent() { if (currentSpeakText) speakJapanese(currentSpeakText); }

function speakFromBtn(btn) {
  const text = btn.getAttribute("data-speak");
  if (text) speakJapanese(text);
}

// ==================== Core ====================
function changeLesson(id) {
  currentLessonId = id;
  updateWrongCount();
  startSession();
}

function setMode(m) {
  mode = m;
  document.querySelectorAll("nav button").forEach(b => b.className = "px-4 py-2 rounded-full text-sm font-medium bg-gray-200");
  document.getElementById("nav-" + m).className = "px-4 py-2 rounded-full text-sm font-medium bg-emerald-800 text-white";
  startSession();
}

function startSession() {
  const list = mode === "wrong" ? getActiveWrongWords() : getActiveWords();
  if (list.length === 0) {
    document.getElementById("content").innerHTML = `<div class="text-center py-16 text-gray-500"><p class="text-lg">${mode==="wrong"?"目前沒有錯題":"此課題沒有詞彙"}</p></div>`;
    return;
  }
  currentQueue = shuffle(list);
  currentIndex = 0;
  updateStats();
  render();
}

function updateStats() {
  const total = getActiveWords().length;
  const wrong = getWrongSet(currentLessonId).size;
  document.getElementById("stats").textContent = `目前詞彙：${total}　|　錯題：${wrong}　|　進度：${currentIndex}/${currentQueue.length}`;
}

function shuffle(a) {
  const arr = [...a];
  for (let i = arr.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function getRandomJP(item) {
  const forms = [item.jp];
  if (item.kanji && item.kanji !== item.jp) forms.push(item.kanji);
  return forms[Math.floor(Math.random()*forms.length)];
}

function render() {
  if (mode === "editor") { renderEditor(); return; }
  if (mode === "library") { renderLibrary(); return; }
  if (mode === "match") renderMatch();
  else renderFlashcard();
}

// ---------- Matching ----------
function renderMatch() {
  const batchSize = Math.min(matchBatchSize, currentQueue.length - currentIndex);
  if (batchSize <= 0) {
    document.getElementById("content").innerHTML = `<div class="text-center py-12"><p class="text-2xl text-emerald-700 mb-4">本輪完成！</p><button onclick="startSession()" class="px-6 py-3 bg-emerald-800 text-white rounded-xl">再來一輪</button></div>`;
    return;
  }
  const batch = currentQueue.slice(currentIndex, currentIndex + batchSize);
  matchItems = batch.map(item => ({...item, displayJP: getRandomJP(item)}));

  const jpCards = shuffle(matchItems.map(i => ({id:i.id, text:i.displayJP})));
  const cnCards = shuffle(matchItems.map(i => ({id:i.id, text:i.cn})));

  document.getElementById("content").innerHTML = `
    <div class="flex flex-col sm:flex-row sm:justify-between items-start sm:items-center gap-2 mb-4">
      <h2 class="text-xl font-bold text-emerald-900">配對練習</h2>
      <div class="flex items-center gap-2 text-sm">
        <label>每組詞數：</label>
        <select onchange="changeMatchBatchSize(this.value)" class="border rounded px-2 py-1">
          <option value="10" ${matchBatchSize===10?"selected":""}>10</option>
          <option value="20" ${matchBatchSize===20?"selected":""}>20</option>
          <option value="9999" ${matchBatchSize>=9999?"selected":""}>全部</option>
        </select>
      </div>
    </div>
    <p class="text-center text-sm text-gray-500 mb-3">本組 ${batchSize} 題</p>
    <div class="grid grid-cols-2 gap-3">
      <div id="jp-col" class="space-y-2"></div>
      <div id="cn-col" class="space-y-2"></div>
    </div>
    <div class="text-center mt-5"><button onclick="nextMatchBatch()" class="px-5 py-2 bg-gray-200 rounded-lg">跳過這組</button></div>
  `;

  const jpCol = document.getElementById("jp-col");
  const cnCol = document.getElementById("cn-col");

  jpCards.forEach(c => {
    const el = document.createElement("div");
    el.className = "card p-3 border-2 border-emerald-200 rounded-xl text-center cursor-pointer hover:bg-emerald-50 jp";
    el.textContent = c.text;
    el.dataset.id = c.id;
    el.dataset.type = "jp";
    el.onclick = () => selectCard(el, c.id, "jp");
    jpCol.appendChild(el);
  });

  cnCards.forEach(c => {
    const el = document.createElement("div");
    el.className = "card p-3 border-2 border-amber-200 rounded-xl text-center cursor-pointer hover:bg-amber-50";
    el.textContent = c.text;
    el.dataset.id = c.id;
    el.dataset.type = "cn";
    el.onclick = () => selectCard(el, c.id, "cn");
    cnCol.appendChild(el);
  });
}

function selectCard(el, id, type) {
  if (el.classList.contains("matched")) return;
  document.querySelectorAll(`[data-type="${type}"]`).forEach(e => e.classList.remove("ring-4","ring-blue-400"));

  if (type === "jp") {
    selectedJP = id;
    el.classList.add("ring-4","ring-blue-400");
    // Auto play pronunciation when clicking Japanese
    const item = matchItems.find(i => i.id === id);
    if (item) speakJapanese(item.jp);
  } else {
    selectedCN = id;
    el.classList.add("ring-4","ring-blue-400");
  }

  if (selectedJP && selectedCN) {
    const wrongSet = getWrongSet(currentLessonId);
    if (selectedJP === selectedCN) {
      document.querySelectorAll(`[data-id="${selectedJP}"]`).forEach(e => {
        e.classList.add("matched","correct");
        e.classList.remove("ring-4","ring-blue-400");
      });
    } else {
      document.querySelectorAll(`[data-id="${selectedJP}"],[data-id="${selectedCN}"]`).forEach(e => {
        e.classList.add("wrong");
        setTimeout(() => e.classList.remove("wrong","ring-4","ring-blue-400"), 700);
      });
      wrongSet.add(selectedJP);
      wrongSet.add(selectedCN);
      // also add to "all" if not already
      getWrongSet("all").add(selectedJP);
      getWrongSet("all").add(selectedCN);
      saveWrong();
    }
    selectedJP = null;
    selectedCN = null;
    checkMatchComplete();
  }
}

function checkMatchComplete() {
  if (document.querySelectorAll(".card:not(.matched)").length === 0) {
    setTimeout(() => {
      currentIndex += matchItems.length;
      updateStats();
      renderMatch();
    }, 500);
  }
}

function nextMatchBatch() {
  currentIndex += matchItems.length || 10;
  if (currentIndex >= currentQueue.length) currentIndex = 0;
  renderMatch();
}

function changeMatchBatchSize(v) {
  matchBatchSize = parseInt(v) || 10;
  localStorage.setItem("jpMatchBatchSize", matchBatchSize);
  currentIndex = 0;
  startSession();
}

// ---------- Flashcard ----------
function renderFlashcard() {
  if (currentIndex >= currentQueue.length) {
    document.getElementById("content").innerHTML = `<div class="text-center py-12"><p class="text-2xl text-emerald-700 mb-4">本輪完成！</p><button onclick="startSession()" class="px-6 py-3 bg-emerald-800 text-white rounded-xl">再來一輪</button></div>`;
    return;
  }
  const item = currentQueue[currentIndex];
  const isJp2Cn = mode === "jp2cn" || (mode === "wrong" && Math.random() > 0.5);
  currentSpeakText = item.jp;

  const question = isJp2Cn
    ? `<div class="flex flex-col items-center">
         <div class="jp text-4xl md:text-5xl font-bold text-emerald-900">${item.kanji || item.jp}</div>
         ${item.kanji ? `<div class="text-xl text-gray-500 mt-1">${item.jp}</div>` : ""}
         <button onclick="speakCurrent()" class="mt-3 px-4 py-2 bg-emerald-100 hover:bg-emerald-200 text-emerald-800 rounded-full text-sm">🔊 聽發音</button>
       </div>`
    : `<div class="text-3xl md:text-4xl font-bold text-amber-800">${item.cn}</div>`;

  const answer = isJp2Cn
    ? `<div class="text-2xl">${item.cn}</div>`
    : `<div class="flex flex-col items-center">
         <div class="jp text-3xl font-bold text-emerald-900">${item.kanji || item.jp}</div>
         ${item.kanji ? `<div class="text-lg text-gray-500">${item.jp}</div>` : ""}
         <button onclick="speakCurrent()" class="mt-3 px-4 py-2 bg-emerald-100 hover:bg-emerald-200 text-emerald-800 rounded-full text-sm">🔊 聽發音</button>
       </div>`;

  document.getElementById("content").innerHTML = `
    <div class="text-center">
      <p class="text-sm text-gray-500 mb-5">${isJp2Cn ? "看日文想中文" : "看中文默寫日文"}　·　第 ${currentIndex+1} / ${currentQueue.length} 題</p>
      <div class="min-h-[140px] flex items-center justify-center mb-6">${question}</div>
      <div id="answer-area" class="min-h-[90px] mb-5 hidden"><div class="text-sm text-gray-500 mb-1">答案</div>${answer}</div>
      <div class="space-y-3">
        <button id="reveal-btn" onclick="revealAnswer()" class="w-full max-w-xs mx-auto block px-6 py-3 bg-amber-500 hover:bg-amber-600 text-white rounded-xl">顯示答案</button>
        <div id="mark-btns" class="hidden flex gap-3 justify-center">
          <button onclick="markAnswer(true)" class="px-8 py-3 bg-green-600 text-white rounded-xl">我答對了</button>
          <button onclick="markAnswer(false)" class="px-8 py-3 bg-red-500 text-white rounded-xl">我答錯了</button>
        </div>
      </div>
    </div>`;
}

function revealAnswer() {
  document.getElementById("answer-area").classList.remove("hidden");
  document.getElementById("reveal-btn").classList.add("hidden");
  document.getElementById("mark-btns").classList.remove("hidden");
}

function markAnswer(correct) {
  const item = currentQueue[currentIndex];
  const set = getWrongSet(currentLessonId);
  const allSet = getWrongSet("all");
  if (correct) {
    set.delete(item.id);
    allSet.delete(item.id);
  } else {
    set.add(item.id);
    allSet.add(item.id);
  }
  saveWrong();
  currentIndex++;
  updateStats();
  renderFlashcard();
}

// ---------- Library / 温習庫 ----------
function renderLibrary() {
  const words = getActiveWords();
  if (words.length === 0) {
    document.getElementById("content").innerHTML = `<div class="text-center py-16 text-gray-500">此課題沒有詞彙</div>`;
    return;
  }

  const lessonName = currentLessonId === "all" ? "全部課題" : (LESSONS.find(l => l.id === currentLessonId)?.name || "");

  let html = `
    <h2 class="text-xl font-bold text-emerald-900 mb-1">温習庫</h2>
    <p class="text-sm text-gray-500 mb-4">${lessonName}　·　共 ${words.length} 個詞</p>
    <div class="space-y-2 max-h-[70vh] overflow-y-auto pr-1">
  `;

  words.forEach((w) => {
    const displayJP = w.kanji 
      ? `${w.kanji}<span class="text-gray-400 text-sm ml-2">(${w.jp})</span>` 
      : w.jp;
    html += `
      <div class="flex items-center justify-between gap-3 p-3 border border-gray-100 rounded-xl hover:bg-emerald-50/40">
        <div class="flex-1 min-w-0">
          <div class="jp text-lg font-medium text-emerald-900">${displayJP}</div>
          <div class="text-sm text-gray-600 mt-0.5">${w.cn}</div>
        </div>
        <button onclick="speakJapanese(this.dataset.speak)" data-speak="${w.jp}" 
                class="flex-shrink-0 px-3 py-1.5 bg-emerald-100 hover:bg-emerald-200 text-emerald-800 rounded-full text-sm whitespace-nowrap">
          🔊 朗讀
        </button>
      </div>
    `;
  });

  html += `</div>`;
  document.getElementById("content").innerHTML = html;
}

function renderEditor() {
  document.getElementById("content").innerHTML = `
    <h2 class="text-xl font-bold mb-3 text-emerald-900">詞彙管理 / 資料備份</h2>
    <p class="text-sm text-gray-600 mb-4">手機上直接開啟 HTML 檔時，錯題庫可能無法長期保存。建議定期匯出錯題庫備份。</p>
    
    <div class="space-y-3 mb-6">
      <button onclick="exportWrong()" class="w-full max-w-xs px-4 py-2.5 bg-emerald-700 text-white rounded-xl text-sm">匯出錯題庫（備份）</button>
      <div>
        <label class="block text-sm text-gray-600 mb-1">匯入錯題庫：</label>
        <input type="file" id="import-file" accept=".json" onchange="importWrong(this)" class="text-sm">
      </div>
    </div>

    <div class="text-sm text-gray-500">
      <p>目前詞彙已內建第1～12課。若要修改詞彙，可直接編輯此 HTML 檔案中的 LESSONS 陣列。</p>
    </div>
  `;
}

function exportWrong() {
  const obj = {};
  for (const k in wrongByLesson) {
    obj[k] = [...wrongByLesson[k]];
  }
  const data = JSON.stringify(obj, null, 2);
  const blob = new Blob([data], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "japanese-wrong-bank-backup.json";
  a.click();
  URL.revokeObjectURL(url);
  alert("錯題庫已匯出，請保存這個 JSON 檔案。");
}

function importWrong(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const obj = JSON.parse(e.target.result);
      wrongByLesson = {};
      for (const k in obj) {
        wrongByLesson[k] = new Set(obj[k]);
      }
      saveWrong();
      updateWrongCount();
      alert("錯題庫匯入成功！");
      if (mode === "wrong") startSession();
    } catch (err) {
      alert("匯入失敗，檔案格式不正確。");
    }
  };
  reader.readAsText(file);
}

// ==================== Init ====================
loadData();
document.getElementById("lesson-select").value = currentLessonId;
setMode("match");
</script>
